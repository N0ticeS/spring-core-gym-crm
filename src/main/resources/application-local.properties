spring.datasource.url=jdbc:postgresql://localhost:5432/gym_crm_local
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.data-locations=\
classpath:sql/users.sql,\
classpath:sql/training_types.sql,\
classpath:sql/trainees.sql,\
classpath:sql/trainers.sql,\
classpath:sql/trainee_trainers.sql,\
classpath:sql/trainings.sql
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.transaction=TRACE
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

